<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anime Stream</title>
<meta name="description" content="Search anime, browse what's trending, and watch across multiple sources." />

<script>
  // Global error catcher — installed before anything else can fail, so any
  // uncaught error (including CDN scripts failing to load/execute) shows up
  // as a visible on-page banner instead of a silent blank page.
  window.addEventListener("error", function (e) {
    showDiagBanner((e.error && e.error.stack) || e.message || "Unknown script error");
  });
  window.addEventListener("unhandledrejection", function (e) {
    showDiagBanner("Unhandled promise rejection: " + (e.reason && (e.reason.stack || e.reason.message || e.reason)));
  });
  function showDiagBanner(text) {
    var el = document.getElementById("diag-banner");
    if (!el) {
      el = document.createElement("div");
      el.id = "diag-banner";
      el.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#dc2626;color:#fff;font:12px/1.5 monospace;padding:10px 14px;white-space:pre-wrap;max-height:40vh;overflow:auto;";
      document.documentElement.appendChild(el);
    }
    var line = document.createElement("div");
    line.textContent = text;
    line.style.borderTop = "1px solid rgba(255,255,255,0.3)";
    line.style.paddingTop = "6px";
    line.style.marginTop = "6px";
    el.appendChild(line);
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" onerror="showDiagBanner('Failed to load Tailwind CDN script — check network/ad-block')"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer onerror="showDiagBanner('Failed to load Lucide icons CDN script')"></script>

<style type="text/tailwindcss">
  @theme {
    --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;

    /* shadcn-style neutral scale, light mode */
    --color-background: oklch(1 0 0);
    --color-foreground: oklch(0.145 0 0);
    --color-card: oklch(1 0 0);
    --color-card-foreground: oklch(0.145 0 0);
    --color-muted: oklch(0.97 0 0);
    --color-muted-foreground: oklch(0.45 0 0);
    --color-border: oklch(0.90 0 0);
    --color-input: oklch(0.90 0 0);
    --color-primary: oklch(0.145 0 0);
    --color-primary-foreground: oklch(0.985 0 0);
    --color-accent: oklch(0.97 0 0);
    --color-accent-foreground: oklch(0.145 0 0);
    --color-ring: oklch(0.145 0 0);
    --color-destructive: oklch(0.55 0.20 27);
  }

  .dark {
    --color-background: oklch(0.145 0 0);
    --color-foreground: oklch(0.985 0 0);
    --color-card: oklch(0.19 0 0);
    --color-card-foreground: oklch(0.985 0 0);
    --color-muted: oklch(0.24 0 0);
    --color-muted-foreground: oklch(0.65 0 0);
    --color-border: oklch(0.28 0 0);
    --color-input: oklch(0.28 0 0);
    --color-primary: oklch(0.985 0 0);
    --color-primary-foreground: oklch(0.145 0 0);
    --color-accent: oklch(0.24 0 0);
    --color-accent-foreground: oklch(0.985 0 0);
    --color-ring: oklch(0.75 0 0);
    --color-destructive: oklch(0.65 0.20 27);
  }

  html { scroll-behavior: smooth; }
  body { font-family: var(--font-sans); background: var(--color-background); color: var(--color-foreground); }

  ::selection { background: var(--color-foreground); color: var(--color-background); }

  :focus-visible {
    outline: 2px solid var(--color-ring);
    outline-offset: 2px;
  }

  .skeleton {
    background: linear-gradient(90deg, var(--color-muted) 25%, var(--color-accent) 37%, var(--color-muted) 63%);
    background-size: 400% 100%;
    animation: skeleton-wave 1.4s ease infinite;
  }
  @keyframes skeleton-wave {
    0% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
  }

  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body class="min-h-screen antialiased">

  <!-- Header -->
  <header class="sticky top-0 z-40 border-b border-border bg-background/80 backdrop-blur supports-[backdrop-filter]:bg-background/60">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 h-16 flex items-center gap-4">
      <a href="/" class="flex items-center gap-2 shrink-0">
        <div class="h-8 w-8 rounded-lg bg-foreground text-background flex items-center justify-center">
          <i data-lucide="clapperboard" class="h-4.5 w-4.5"></i>
        </div>
        <span class="font-semibold text-[15px] tracking-tight hidden sm:block">Anime Stream</span>
      </a>

      <div class="flex-1 max-w-xl mx-auto relative">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-muted-foreground pointer-events-none"></i>
        <input
          id="search-input"
          type="text"
          placeholder="Search anime…"
          autocomplete="off"
          class="w-full h-10 rounded-lg border border-input bg-muted/50 pl-9 pr-9 text-sm placeholder:text-muted-foreground focus:bg-background focus:border-ring transition-colors outline-none"
        />
        <button id="search-clear" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground">
          <i data-lucide="x" class="h-4 w-4"></i>
        </button>
      </div>

      <button id="theme-toggle" aria-label="Toggle theme" class="shrink-0 h-9 w-9 rounded-lg border border-border flex items-center justify-center hover:bg-accent transition-colors">
        <i data-lucide="sun-moon" class="h-4 w-4"></i>
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">

    <!-- Search results (hidden by default) -->
    <section id="search-results-section" class="hidden">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold tracking-tight">Results for "<span id="search-query-label"></span>"</h2>
        <button id="back-to-browse" class="text-sm text-muted-foreground hover:text-foreground flex items-center gap-1.5">
          <i data-lucide="arrow-left" class="h-3.5 w-3.5"></i> Back
        </button>
      </div>
      <div id="search-results-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
      <p id="search-empty" class="hidden text-sm text-muted-foreground py-16 text-center">No results. Try a different title.</p>
    </section>

    <!-- Browse view -->
    <div id="browse-view">
      <section class="mb-10">
        <div class="flex items-center gap-2 mb-4">
          <i data-lucide="flame" class="h-4.5 w-4.5"></i>
          <h2 class="text-lg font-semibold tracking-tight">Trending now</h2>
        </div>
        <div id="trending-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
      </section>

      <section>
        <div class="flex items-center gap-2 mb-4">
          <i data-lucide="star" class="h-4.5 w-4.5"></i>
          <h2 class="text-lg font-semibold tracking-tight">Popular</h2>
        </div>
        <div id="popular-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
      </section>
    </div>
  </main>

  <footer class="border-t border-border mt-16">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8 text-sm text-muted-foreground flex flex-col sm:flex-row items-center justify-between gap-3">
      <p>Metadata from AniList. Streams from third-party sources — availability varies.</p>
      <a href="/docs" class="hover:text-foreground transition-colors flex items-center gap-1.5">
        <i data-lucide="code" class="h-3.5 w-3.5"></i> API docs
      </a>
    </div>
  </footer>

<template id="card-template">
  <a class="anime-card group block" href="#">
    <div class="relative aspect-[2/3] rounded-lg overflow-hidden bg-muted border border-border">
      <img class="card-img absolute inset-0 h-full w-full object-cover transition-transform duration-300 group-hover:scale-105" loading="lazy" />
      <div class="card-score absolute top-2 right-2 hidden items-center gap-1 rounded-md bg-background/90 backdrop-blur px-1.5 py-0.5 text-xs font-medium border border-border">
        <i data-lucide="star" class="h-3 w-3 fill-current"></i>
        <span></span>
      </div>
    </div>
    <h3 class="card-title mt-2 text-sm font-medium leading-snug line-clamp-2 group-hover:text-foreground text-foreground/90"></h3>
    <p class="card-meta text-xs text-muted-foreground mt-0.5"></p>
  </a>
</template>

<template id="skeleton-card-template">
  <div>
    <div class="skeleton aspect-[2/3] rounded-lg border border-border"></div>
    <div class="skeleton h-3.5 w-4/5 rounded mt-2"></div>
    <div class="skeleton h-3 w-2/5 rounded mt-1.5"></div>
  </div>
</template>

<script src="/static/js/theme.js"></script>
<script src="/static/js/home.js"></script>
</body>
</html>
